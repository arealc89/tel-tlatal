input{flex:1;min-width:100px}
button{background:var(--accent);color:#fff;border:0;font-weight:700;cursor:pointer}
button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}

</head>

})();

 try{var src=await (await fetch(location.href.split("#")[0],{cache:"no-store"})).text();
  var data="var EMBED="+JSON.stringify({list:list.map(clean),day:day}).replace(/</g,"\\u003c")+";";

 }catch(e){alert("הייצוא עובד רק כשהקובץ מאוחסן באתר, לא כשפותחים אותו ישירות מהמחשב");}
};
var ideas=[["בנק התלתלים","bank"],["קניון הצ׳יפס","mall"],["מגדל הפירה","tower"],["פסל התלתל הענק","statue"],["מרכז הפלאפל","mall"],["משרדי השיעמום","bank"],["מגדל הקרנבל","tower"],["פסל החתול הנודד","statue"]];

/* camera orbit */
var maxR=170,th=0.7,ph=0.95,rad2=95,drag=null,idle=0;
function setCam(){
  cam.position.set(rad2*Math.sin(ph)*Math.sin(th),rad2*Math.cos(ph),rad2*Math.sin(ph)*Math.cos(th));
  cam.lookAt(0,2,0);
}
cv.addEventListener("pointerdown",function(e){drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);idle=0;});
cv.addEventListener("pointermove",function(e){
  if(!drag)return;
  th-=(e.clientX-drag.x)*.006;ph=Math.max(.35,Math.min(1.4,ph-(e.clientY-drag.y)*.005));
  drag={x:e.clientX,y:e.clientY};
});
cv.addEventListener("pointerup",function(){drag=null;});
cv.addEventListener("wheel",function(e){rad2=Math.max(25,Math.min(maxR,rad2*(e.deltaY>0?1.08:.92)));e.preventDefault();},{passive:false});
document.getElementById("zi").onclick=function(){rad2=Math.max(25,rad2*.85);};
document.getElementById("zo").onclick=function(){rad2=Math.min(maxR,rad2*1.18);};

function resize(){
  var w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
}
addEventListener("resize",resize);resize();

var v3=new THREE.Vector3(), cars=[];
var carCols=[0xd62828,0x1d4ed8,0xf5f5f5,0x222222,0xf2c200,0x2a9d8f];
for(var q2=0;q2<22;q2++){var cg=new THREE.Group();var cb=box(1.3,.6,2.4,carCols[q2%6]);cb.position.y=.55;cg.add(cb);var ct=box(1.1,.5,1.2,0x9db7c9);ct.position.set(0,1.05,-.1);cg.add(ct);cg.traverse(function(o){if(o.isMesh)o.castShadow=true;});var lane=Math.floor(Math.random()*(N+1)),dv=Math.random()<.5?1:-1;cars.push({g:cg,hz:Math.random()<.5,off:(lane-c-.5)*P+(dv>0?.6:-.6),d:dv,p:(Math.random()-.5)*W,sp:.12+Math.random()*.1});S.add(cg);}
function loop(t){
  requestAnimationFrame(loop);
  if(!drag){idle++;if(idle>240)th+=0.0015;}
  setCam();
  cars.forEach(function(o){o.p+=o.sp*o.d;if(o.p>W/2)o.p=-W/2;if(o.p<-W/2)o.p=W/2;if(o.hz){o.g.position.set(o.p,.12,o.off);o.g.rotation.y=o.d>0?Math.PI/2:-Math.PI/2;}else{o.g.position.set(o.off,.12,o.p);o.g.rotation.y=o.d>0?0:Math.PI;}});
  grow.forEach(function(o){o.t=Math.min(1,o.t+.012);var e=1-Math.pow(1-o.t,3);o.m.scale.y=Math.max(.01,e);});
  grow=grow.filter(function(o){return o.t<1;});
  cranes.forEach(function(o){o.t+=.012;});
  cranes=cranes.filter(function(o){if(o.t>=1.4){S.remove(o.c);return false;}return true;});
  if(last&&lb.textContent&&performance.now()-lastT<4500){
    v3.copy(last.position);v3.y+=(last.userData.h||5)+1;v3.project(cam);
    if(v3.z<1){lb.style.display="block";lb.style.left=((v3.x+1)/2*innerWidth)+"px";lb.style.top=((1-v3.y)/2*innerHeight)+"px";}
  }else lb.style.display="none";
  R.render(S,cam);
}
loop(0);
})();
</script>
